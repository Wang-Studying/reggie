<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单明细</title>
    <link rel="stylesheet" href="../../plugins/element-ui/index.css"/>
    <link rel="stylesheet" href="../../styles/common.css"/>
    <link rel="stylesheet" href="../../styles/page.css"/>
    <style>
        .search-btn {
            margin-left: 20px;
        }

        .tableBar {
            justify-content: flex-start !important;
        }

        .info-box {
            margin: -15px -44px 20px;
        }

        .info-box .item-box {
            display: flex;
            height: 20px;
            line-height: 20px;
            font-size: 14px;
            font-weight: 400;
            color: #666666;
            text-align: left;
            margin-bottom: 14px;
        }

        .info-box .item-box:last-child {
            margin-bottom: 0;
        }

        .info-box .item-box .label {
            width: 96px;
        }

        .info-box .item-box .des {
            flex: 1;
            color: #333333;
        }
    </style>
</head>
<body>
<div class="dashboard-container" id="order-app">
    <div class="container">
        <div class="tableBar">
            <el-input v-model="input" placeholder="请输入订单号" style="width: 250px" clearable
                      @keyup.enter.native="handleQuery">
                <i slot="prefix" class="el-input__icon el-icon-search" style="cursor: pointer" @click="handleQuery"></i>
            </el-input>
            <el-date-picker v-model="beginTime" type="date" placeholder="开始日期"
                           value-format="yyyy-MM-dd HH:mm:ss" style="width: 180px; margin-left: 20px;">
            </el-date-picker>
            <span style="margin: 0 10px; color: #ccc;">至</span>
            <el-date-picker v-model="endTime" type="date" placeholder="结束日期"
                           value-format="yyyy-MM-dd HH:mm:ss" style="width: 180px;">
            </el-date-picker>
            <el-button type="primary" class="search-btn" @click="handleQuery">查询</el-button>
        </div>
        <el-table :data="tableData" stripe class="tableBox">
            <el-table-column prop="number" label="订单号"></el-table-column>
            <el-table-column label="订单状态">
                <template slot-scope="scope">
                    <span>{{ getStatusText(scope.row.status) }}</span>
                </template>
            </el-table-column>
            <el-table-column prop="consignee" label="收货人"></el-table-column>
            <el-table-column prop="phone" label="手机号"></el-table-column>
            <el-table-column prop="address" label="地址"></el-table-column>
            <el-table-column prop="orderTime" label="下单时间"></el-table-column>
            <el-table-column label="实收金额">
                <template slot-scope="scope">
                    <span>￥{{ scope.row.amount }}</span>
                </template>
            </el-table-column>
            <el-table-column label="操作" width="160" align="center">
                <template slot-scope="scope">
                    <el-button type="text" size="small" class="blueBug" @click="showOrderDetail(scope.row)">查看</el-button>
                    <el-button type="text" size="small" v-if="scope.row.status === 2" @click="editOrderStatus(scope.row.id, 3)" class="blueBug">派送</el-button>
                    <el-button type="text" size="small" v-if="scope.row.status === 3" @click="editOrderStatus(scope.row.id, 4)" class="blueBug">完成</el-button>
                </template>
            </el-table-column>
        </el-table>
        <el-pagination
                class="pageList"
                :page-sizes="[10, 20, 30, 40]"
                :page-size="pageSize"
                layout="total, sizes, prev, pager, next, jumper"
                :total="counts"
                @size-change="handleSizeChange"
                :current-page.sync="page"
                @current-change="handleCurrentChange"
        ></el-pagination>
    </div>

    <el-dialog title="订单信息" :visible.sync="dialogVisible" width="50%">
        <div class="info-box">
            <div class="item-box">
                <span class="label">订单号：</span>
                <span class="des">{{ orderInfo.number }}</span>
            </div>
            <div class="item-box">
                <span class="label">订单状态：</span>
                <span class="des">{{ getStatusText(orderInfo.status) }}</span>
            </div>
            <div class="item-box">
                <span class="label">订单明细：</span>
                <div class="des" style="margin-left: -96px; padding-left: 96px;">
                    <el-table :data="orderInfo.orderDetails" size="small" style="width: 100%;">
                        <el-table-column prop="name" label="菜品"></el-table-column>
                        <el-table-column prop="dishFlavor" label="口味"></el-table-column>
                        <el-table-column prop="number" label="数量"></el-table-column>
                        <el-table-column prop="amount" label="金额"></el-table-column>
                    </el-table>
                </div>
            </div>
            <div class="item-box">
                <span class="label">支付金额：</span>
                <span class="des">{{ orderInfo.amount }}</span>
            </div>
            <div class="item-box">
                <span class="label">收货人：</span>
                <span class="des">{{ orderInfo.consignee }}</span>
            </div>
            <div class="item-box">
                <span class="label">联系电话：</span>
                <span class="des">{{ orderInfo.phone }}</span>
            </div>
            <div class="item-box">
                <span class="label">地址：</span>
                <span class="des">{{ orderInfo.address }}</span>
            </div>
            <div class="item-box">
                <span class="label">下单时间：</span>
                <span class="des">{{ orderInfo.orderTime }}</span>
            </div>
        </div>
    </el-dialog>
</div>

<script src="../../plugins/vue/vue.js"></script>
<script src="../../plugins/element-ui/index.js"></script>
<script src="../../plugins/axios/axios.min.js"></script>
<script src="../../js/request.js"></script>
<script src="../../api/order.js"></script>
<script>
    new Vue({
        el: '#order-app',
        data() {
            return {
                input: '',
                beginTime: '',
                endTime: '',
                counts: 0,
                page: 1,
                pageSize: 10,
                tableData: [],
                dialogVisible: false,
                orderInfo: {
                    number: '',
                    status: '',
                    orderDetails: [],
                    amount: '',
                    consignee: '',
                    phone: '',
                    address: '',
                    orderTime: ''
                }
            }
        },
        created() {
            this.init()
        },
        methods: {
            async init() {
                const params = {
                    page: this.page,
                    pageSize: this.pageSize,
                    number: this.input ? this.input : undefined,
                    beginTime: this.beginTime ? this.beginTime : undefined,
                    endTime: this.endTime ? this.endTime : undefined
                }
                await getOrderDetailPage(params).then(res => {
                    if (String(res.code) === '1') {
                        this.tableData = res.data.records || []
                        this.counts = res.data.total
                    }
                }).catch(err => {
                    this.$message.error('请求出错了：' + err)
                })
            },
            getStatusText(status) {
                const statusMap = {
                    1: '待付款',
                    2: '待派送',
                    3: '已派送',
                    4: '已完成',
                    5: '已取消'
                }
                return statusMap[status] || '未知'
            },
            handleSizeChange(val) {
                this.pageSize = val
                this.init()
            },
            handleCurrentChange(val) {
                this.page = val
                this.init()
            },
            handleQuery() {
                this.page = 1
                this.init()
            },
            showOrderDetail(row) {
                this.orderInfo = {
                    number: row.number,
                    status: row.status,
                    orderDetails: row.orderDetails || [],
                    amount: row.amount,
                    consignee: row.consignee,
                    phone: row.phone,
                    address: row.address,
                    orderTime: row.orderTime
                }
                this.dialogVisible = true
            },
            editOrderStatus(id, status) {
                const params = {
                    id: id,
                    status: status
                }
                editOrderDetail(params).then(res => {
                    if (res.code === 1) {
                        this.$message.success('订单状态修改成功')
                        this.init()
                    } else {
                        this.$message.error(res.msg || '操作失败')
                    }
                }).catch(err => {
                    this.$message.error('请求出错了：' + err)
                })
            }
        }
    })
</script>
</body>
</html>
